<h2 class="text-xl font-semibold mb-4">Update User</h2>

<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="space-y-4 max-w-xl mx-auto">
  <div>
    <label class="block mb-1">Name</label>
    <input type="text" formControlName="name" class="w-full border p-2 rounded" />
  </div>

  <div>
    <label class="block mb-1">Email</label>
    <input type="email" formControlName="email" class="w-full border p-2 rounded" />
  </div>

  <div>
    <label class="block mb-1">Mobile Number</label>
    <input type="text" formControlName="mobileNumber" class="w-full border p-2 rounded" />
  </div>

  <div>
    <label class="block mb-1">Company Name</label>
    <input type="text" formControlName="companyName" class="w-full border p-2 rounded" />
  </div>

  <div>
    <label class="block mb-1">Role</label>
    <select formControlName="roleId" class="w-full border p-2 rounded">
      <option *ngFor="let role of roles" [value]="role.roleId">{{ role.roleName }}</option>
    </select>
  </div>

  <div>
    <label class="block mb-1">Status</label>
    <select formControlName="statusId" class="w-full border p-2 rounded">
      <option *ngFor="let status of statuses" [value]="status.statusId">{{ status.statusName }}</option>
    </select>
  </div>

  <div>
    <label class="block mb-1">Gender</label>
    <select formControlName="gender" class="w-full border p-2 rounded">
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
  </div>

  <div>
    <label class="block mb-1">Country</label>
    <select formControlName="countryId" class="w-full border p-2 rounded">
      <option *ngFor="let country of countries" [value]="country.countryId">{{ country.countryName }}</option>
    </select>
  </div>

  <div class="text-center">
    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
      Update User
    </button>
  </div>
</form>
